[package]
name = "key"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Key research PDF reader desktop application"

[lib]
name = "key_app"
# This desktop shell links through rlib. A mobile static archive is unused
# and duplicates the complete native dependency graph in each debug build.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
key-processing = { path = "../../../crates/key-processing" }
key-library = { path = "../../../crates/key-library" }
anyhow = "1"
key-pdf-core = { path = "../../../crates/key-pdf-core" }
key-pdf-runtime = { path = "../../../crates/key-pdf-runtime" }
key-pdfium = { path = "../../../crates/key-pdfium" }
key-reference = { path = "../../../extensions/key-reference" }
key-semantic-search = { path = "../../../crates/key-semantic-search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Keep the desktop shell independently resolvable. It consumes the repository's
# shared crates through path dependencies without merging its Tauri dependency
# graph into the renderer-neutral root workspace.
[workspace]

[features]
semantic-onnx = ["key-semantic-search/semantic-onnx"]

[patch.crates-io]
pdfium-render = { path = "../../../vendor/pdfium-render-tile" }
