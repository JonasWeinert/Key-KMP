[package]
name = "opendataloader-pdf"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Standalone PDFium-backed academic PDF extraction in Rust"
license = "Apache-2.0"
readme = "README.md"
include = ["build.rs", "Cargo.toml", "LICENSE", "README.md", "THIRD_PARTY_NOTICES.md", "models/model_fp16.onnx", "src/**", "tests/**"]

[features]
default = ["onnx", "xml"]
onnx = ["dep:half", "dep:ort"]
xml = ["dep:roxmltree", "dep:ureq", "dep:url"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
pdfium-render = "=0.9.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
half = { version = "2", optional = true }
libc = "=0.2.186"
libloading = "=0.9.0"
lopdf = "=0.42.0"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "half"], optional = true }
regex = "1"
roxmltree = { version = "0.20", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
pretty_assertions = "1"
